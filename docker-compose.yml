services:
  medscreen:
    image: medscreen:latest
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - HF_TOKEN
      args:
        HF_TOKEN: ${HF_TOKEN}
    container_name: medscreen
    ports:
      - "8501:8501"
      - "8502:8502"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - NVIDIA_VISIBLE_DEVICES=all
      - PYTHONPATH=/app
      - HF_HOME=/app/huggingface_cache
      - HF_TOKEN=${HF_TOKEN}
    restart: unless-stopped
    runtime: nvidia

secrets:
  HF_TOKEN:
    environment: HF_TOKEN
